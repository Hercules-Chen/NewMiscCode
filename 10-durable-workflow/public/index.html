<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Durable Workflow 儀表板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%232a78d6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" data-i18n="appTitle">Durable Workflow 儀表板</a>
  <nav class="views">
    <a href="#/" data-view="runs" data-i18n="navRuns">執行清單</a>
    <a href="#/debug" data-view="debug" data-i18n="navDebug">除錯</a>
  </nav>
  <div class="tools">
    <label class="auto"><input type="checkbox" id="autoRefresh" checked> <span data-i18n="autoRefresh">自動更新</span></label>
    <button id="langBtn" type="button" data-testid="lang-toggle">EN</button>
    <button id="themeBtn" type="button" data-testid="theme-toggle" title="theme">主題：自動</button>
  </div>
</header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
