openapi: 3.0.3
info:
  title: Order API
  version: 1.0.0
  description: 舊版訂單 API（v1）。Old order API.
servers:
  - url: http://127.0.0.1:3001
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: v1 }
  /orders:
    get:
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: 訂單列表
          headers:
            X-Total-Count:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewOrder' }
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: 驗證錯誤
          content:
            application/json:
              schema: { $ref: 'common.yaml#/Error' }
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getOrder
      responses:
        '200':
          description: 單筆訂單
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          description: 找不到
          content:
            application/json:
              schema: { $ref: 'common.yaml#/Error' }
    delete:
      operationId: deleteOrder
      responses:
        '204': { description: 已刪除 }
components:
  parameters:
    StatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum: [pending, paid, shipped, cancelled]
  responses:
    Unauthorized:
      description: 未授權
      content:
        application/json:
          schema: { $ref: 'common.yaml#/Error' }
  schemas:
    LineItem:
      type: object
      required: [sku, qty]
      properties:
        sku: { type: string, example: TEA-001 }
        qty: { type: integer, format: int32, example: 2 }
        price: { type: number, example: 350 }
    NewOrder:
      type: object
      required: [customerName, items]
      properties:
        customerName: { type: string, maxLength: 100, example: 王小明 }
        email: { type: string, format: email }
        note: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
    Order:
      type: object
      required: [id, customerName, status, total, items, note, createdAt]
      properties:
        id: { type: string, example: ord-1001 }
        customerName: { type: string, example: 王小明 }
        email: { type: string, example: ming@example.com }
        status: { type: string, enum: [pending, paid, shipped, cancelled], example: paid }
        total: { type: number, example: 1250.5 }
        items:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
        note: { type: string, example: 請於下午送達 }
        createdAt: { type: string, format: date-time, example: '2026-01-05T10:00:00Z' }
    OrderList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        count: { type: integer, example: 1 }
