[package]
name = "vr-core"
version = "0.1.0"
edition = "2021"
description = "Visual regression image-diff core (PNG decode, YIQ anti-aliasing-aware diff, ignore regions, box clustering) for native and WebAssembly"
license = "MIT"

[lib]
name = "vr_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vr-native"
path = "src/bin/vr_native.rs"

[dependencies]
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
